# check: evaluates and builds the example Mac, runs the tests of the
# migration wizard, and lints the scripts and the Nix files. e2e: a real
# setup on a fresh macOS runner, which is a used Mac with Homebrew packages
# and dotfiles, then tests/e2e/verify.sh and tests/e2e/migrated.sh.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      # --inputs-from uses the locked inputs below; no global registry is needed.
      NIX_CONFIG: flake-registry =
    steps:
      - uses: actions/checkout@v7

      # Upstream Nix from the official installer.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ github.token }}

      - name: nix flake check
        run: nix flake check --print-build-logs

      - name: Build the example Mac
        run: nix build .#checks.aarch64-darwin.example --no-link --print-build-logs

      # The linters come from the Nixpkgs in flake.lock.
      - name: shellcheck
        run: |
          nix shell --inputs-from . nixpkgs#shellcheck -c shellcheck -x \
            dotkit scripts/setup scripts/dotkit-pkg scripts/nix.sh migrate/dotkit-migrate \
            scripts/herdr/git-status.sh scripts/herdr/process-name.sh \
            scripts/herdr/process-name.bash config/bash/bash_profile \
            templates/default/dotkit tests/e2e/verify.sh \
            tests/e2e/etc-restored.sh tests/e2e/migrated.sh tests/e2e/tidy.sh tests/setup.sh

      # shellcheck does not read zsh. zsh -n parses a file without running it.
      # scripts/herdr/process-name.sh is sourced by zsh too.
      - name: zsh -n
        run: |
          for f in config/zsh/zshenv config/zsh/zprofile config/zsh/zshrc \
            nix/modules/zsh/lib/*.zsh nix/completions/_dotkit \
            scripts/herdr/process-name.zsh scripts/herdr/process-name.sh; do
            nix shell --inputs-from . nixpkgs#zsh -c zsh -n "$f" || exit 1
          done

      - name: python
        run: nix shell --inputs-from . nixpkgs#python3 -c python3 -m py_compile scripts/herdr/git-status.py

      # The scanner, the rc parser, the mapping, secret detection, and the
      # wizard in a pseudo terminal. nix flake check runs them too; here the
      # log shows each test, and nixfmt checks the generated Nix files.
      # Functions of scripts/setup, in a temporary home directory.
      - name: setup functions
        run: tests/setup.sh

      # The wizard runs with the macOS Python (3.9 in the Command Line Tools);
      # the Python of Nixpkgs checks a newer version.
      - name: migration wizard tests, macOS Python
        working-directory: migrate
        run: |
          /usr/bin/python3 --version
          nix shell --inputs-from .. nixpkgs#nixfmt -c /usr/bin/python3 -m unittest discover -s tests -t . -v

      - name: migration wizard tests, Nixpkgs Python
        working-directory: migrate
        run: nix shell --inputs-from .. nixpkgs#python3 nixpkgs#nixfmt -c python3 -m unittest discover -s tests -t . -v

      - name: nixfmt
        run: git ls-files -z '*.nix' | xargs -0 nix shell --inputs-from . nixpkgs#nixfmt -c nixfmt --check

      - name: statix
        run: nix shell --inputs-from . nixpkgs#statix -c statix check .

      - name: deadnix
        run: nix shell --inputs-from . nixpkgs#deadnix -c deadnix --fail .

      - name: actionlint
        run: nix shell --inputs-from . nixpkgs#actionlint -c actionlint

  e2e:
    # setup supports macOS 14 and newer. CI covers macOS 26.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      # Build with this commit instead of the dotkit release that the new
      # dotfiles repository would lock (github:podkovyrin/dotkit).
      DOTKIT_DIR: ${{ github.workspace }}
      # GitHub downloads of Nix and mise, without the anonymous rate limit.
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      # The migration wizard raises on a crash or a conflict of one of its
      # parts, instead of leaving the part out (tests and CI only).
      DOTKIT_MIGRATE_STRICT: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # Nix reads DOTKIT_DIR as a Git repository and refuses a shallow one.
          fetch-depth: 0

      # The runner image has Homebrew and some dotfiles. Setup must cope.
      - name: Show the runner before setup
        run: |
          ls -la ~ ~/.config || true
          brew list --formula --versions | wc -l
          brew list --cask --versions
          # tests/e2e/verify.sh checks that setup uninstalled none of them.
          brew list --formula -1 >"$RUNNER_TEMP/brew-formulae-before"
          brew list --cask -1 >"$RUNNER_TEMP/brew-casks-before"
          # tests/e2e/migrated.sh checks that the new lists have them.
          brew leaves --installed-on-request >"$RUNNER_TEMP/brew-leaves-before"
          brew list --cask --full-name -1 >"$RUNNER_TEMP/brew-casks-full-before"
          brew tap | tee "$RUNNER_TEMP/brew-taps-before"
          # The runner has a ~/.bash_profile. Home Manager must rename it.
          cp ~/.bash_profile "$RUNNER_TEMP/bash_profile-before"

      # The runner image adds pwsh to /etc/shells. nix-darwin does not replace
      # a changed file that it does not know, and asks to move it aside. On a
      # Mac with its own /etc/shells, a teammate does the same.
      - name: Move the changed /etc/shells aside
        run: sudo mv /etc/shells /etc/shells.before-nix-darwin

      # A used Mac often has its own ~/.zprofile and ~/.zshrc, for example with
      # the lines from the Homebrew installer. Home Manager must rename them.
      # The wizard carries the export and the alias, moves the secret to
      # ~/.secrets, and reports the other lines; tests/e2e/migrated.sh checks it.
      - name: Add the dotfiles of a used Mac
        run: |
          # shellcheck disable=SC2016 # The line for the file, not to expand.
          echo 'eval "$(/opt/homebrew/bin/brew shellenv)"' >~/.zprofile
          # shellcheck disable=SC2016
          printf '%s\n' \
            'export OLD_ZSHRC=1' \
            "alias oldll='ls -l'" \
            'eval "$(starship init zsh)"' \
            'if [[ -n $OLD_ZSHRC ]]; then' \
            '  export OLD_BLOCK=1' \
            'fi' \
            'source ~/.old-zsh-plugin.zsh' \
            'export MIGRATION_TEST_PASSWORD=not-a-real-secret-0042' >~/.zshrc
          # A config file of another dotfiles manager, as a link. The wizard
          # copies it into the repository; setup moves the link aside.
          mkdir -p ~/old-dotfiles ~/.config
          echo 'add_newline = false' >~/old-dotfiles/starship.toml
          ln -s ~/old-dotfiles/starship.toml ~/.config/starship.toml
          # Global tools of npm and pipx. The wizard moves them to mise.
          npm install --global cowsay
          npm root --global
          pipx install pycowsay
          # dotkit does not link ~/.bashrc. An interactive bash -l reads it.
          echo 'export OLD_BASHRC=1' >>~/.bashrc
          # A registry with a token, after the global installs. The wizard
          # moves the token to ~/.secrets and npm reads it from there. The
          # token is made here, so that no file of dotkit has one.
          printf '%s\n' '@dotkit-test:registry=https://npm.pkg.github.com' \
            "//npm.pkg.github.com/:_authToken=npm_$(printf 'x%.0s' $(seq 36))" >>~/.npmrc

      # The way a teammate sets up a new Mac, without a repository URL, so it
      # creates ~/.dotfiles from the template. --yes: there is no terminal.
      - name: Setup
        run: scripts/setup --yes

      # The first switch cannot set the login shell, the second one does (see
      # nix/darwin.nix). It also shows that a second apply works.
      - name: Apply again
        run: /run/current-system/sw/bin/zsh -lc 'dotkit apply'

      - name: Verify
        run: tests/e2e/verify.sh
        env:
          BREW_BEFORE: ${{ runner.temp }}

      - name: Verify the migration
        run: tests/e2e/migrated.sh "$RUNNER_TEMP"

      # Apps from a "DMG": dotkit tidy adopts one, and brew bundle adopts one
      # that the list has. After the checks of the migration, which compare
      # the lists with the runner before setup.
      - name: Verify dotkit tidy
        run: tests/e2e/tidy.sh

      - name: Show the migration report
        if: always()
        run: cat ~/.dotfiles/MIGRATION.md ~/.dotfiles/nix/brews.txt ~/.dotfiles/nix/casks.txt ~/.dotfiles/nix/taps.txt ~/.dotfiles/nix/mas.txt ~/.dotfiles/config/mise.toml ~/.dotfiles/nix/home.nix || true

      # Setup moves the /etc files that the Nix installer changed to the
      # backup names of nix-darwin.
      - name: Check the renamed files
        run: |
          grep -q 'brew shellenv' ~/.zprofile.before-dotkit
          grep -q OLD_ZSHRC ~/.zshrc.before-dotkit
          cmp "$RUNNER_TEMP/bash_profile-before" ~/.bash_profile.before-dotkit
          # shellcheck disable=SC2016 # For the inner shell.
          /bin/bash -lic 'echo "OLD_BASHRC=${OLD_BASHRC-}"' </dev/null | grep -qx OLD_BASHRC=1
          ls -l /etc/zshrc.before-nix-darwin /etc/bashrc.before-nix-darwin

      - name: Show /etc after a failure
        if: failure()
        run: |
          cd /etc
          shasum -a 256 shells bashrc zshrc zprofile zshenv nix/nix.conf ./*.backup-before-nix || true
          for f in shells bashrc zshrc zprofile zshenv; do
            printf '\n== /etc/%s\n' "$f"; cat "$f" || true
            [[ ! -e $f.backup-before-nix ]] || diff "$f.backup-before-nix" "$f" || true
          done

  # Setup moves /etc/zshrc and /etc/bashrc of the Nix installer aside. When
  # the activation fails, it must move them back. Here it fails because the
  # changed /etc/shells of the runner stays. macOS 26 only, to keep CI short.
  e2e-etc:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DOTKIT_DIR: ${{ github.workspace }}
      NIX_CONFIG: access-tokens = github.com=${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Nix is on the Mac before setup, so the /etc files from before setup
      # have the lines of the Nix installer. The installer and its options are
      # the ones of setup.
      - name: Install Nix as setup does
        run: |
          url=$(sed -n "s/^ *local url='\(.*\)'$/\1/p" scripts/setup)
          sha256=$(sed -n "s/^ *local sha256='\(.*\)'$/\1/p" scripts/setup)
          curl -fsSL --output "$RUNNER_TEMP/nix-install.sh" "$url"
          echo "$sha256  $RUNNER_TEMP/nix-install.sh" | shasum -a 256 -c
          env -u CI -u NONINTERACTIVE -u NIX_INSTALLER_YES \
            /bin/sh "$RUNNER_TEMP/nix-install.sh" --daemon --no-channel-add --yes
          mkdir "$RUNNER_TEMP/etc-before"
          cp /etc/zshrc /etc/bashrc "$RUNNER_TEMP/etc-before/"
          grep -q '^# Nix$' /etc/zshrc

      # With Nix on the Mac, the dry run prints the plan and the report, and
      # writes nothing.
      - name: Setup dry run
        run: |
          set -o pipefail
          DOTFILES=~/.dotfiles-dry scripts/setup --dry-run | tee "$RUNNER_TEMP/dry-run.log"
          grep -q '^--- MIGRATION.md' "$RUNNER_TEMP/dry-run.log"
          grep -q '^# Migration from' "$RUNNER_TEMP/dry-run.log"
          test ! -e ~/.dotfiles-dry
          test ! -e ~/.dotfiles

      # A folded GNU Stow directory: setup moves the link aside before the
      # activation, back when it fails, and again in the next run.
      - name: Setup fails at /etc/shells
        run: |
          set -o pipefail
          mkdir -p ~/stow/ghostty ~/.config
          echo 'font-size = 15' >~/stow/ghostty/config
          ln -s ~/stow/ghostty ~/.config/ghostty
          status=0
          scripts/setup --yes 2>&1 | tee "$RUNNER_TEMP/setup.log" || status=$?
          tests/e2e/etc-restored.sh "$status" "$RUNNER_TEMP/setup.log" "$RUNNER_TEMP/etc-before"
          test "$(readlink ~/.config/ghostty)" = ~/stow/ghostty
          test ! -e ~/.config/ghostty.before-dotkit
          grep -qx .config/ghostty ~/.dotfiles/.build/links-in-way

      # As the message of nix-darwin says.
      - name: Move the changed /etc/shells aside
        run: sudo mv /etc/shells /etc/shells.before-nix-darwin

      - name: Setup
        run: scripts/setup --yes

      - name: Check /etc and the moved link
        run: |
          for name in zshrc bashrc; do
            test "$(readlink "/etc/$name")" = "/etc/static/$name"
            cmp "$RUNNER_TEMP/etc-before/$name" "/etc/$name.before-nix-darwin"
          done
          test "$(readlink /run/current-system)" = "$(readlink ~/.dotfiles/.build/system)"
          test "$(readlink ~/.config/ghostty.before-dotkit)" = ~/stow/ghostty
          cmp ~/.config/ghostty/config.local ~/stow/ghostty/config
          test ! -e ~/.dotfiles/.build/links-in-way

      - name: Show /etc after a failure
        if: failure()
        run: |
          ls -l /etc/shells* /etc/zshrc* /etc/bashrc* || true
          cat "$RUNNER_TEMP/setup.log" || true
