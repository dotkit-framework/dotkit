# dotkit base. Ghostty reads ~/.config/ghostty/config.local after this file,
# so settings there win. Reference: https://ghostty.org/docs/config
# Reload with Cmd+Shift+, (comma).

font-family = "JetBrainsMono Nerd Font"
font-size = 14
font-thicken = true
font-thicken-strength = 100

# Follows the macOS light or dark appearance.
theme = light:Catppuccin Latte,dark:Catppuccin Mocha

window-padding-x = 8
window-padding-y = 6
window-padding-balance = true

clipboard-trim-trailing-spaces = true

# Option is Alt, so herdr gets Alt+1..9 (switch tab).
macos-option-as-alt = true

# herdr. The prefix is Ctrl+B.
keybind = cmd+s=text:\x02
keybind = cmd+n=text:\x02n
keybind = cmd+p=text:\x02p
# Ctrl+D: ends the shell, which closes the herdr pane.
keybind = cmd+w=text:\x04

keybind = cmd+t=ignore

# Cmd+D and Cmd+1..9 go to herdr (goto, switch workspace) as CSI u keys.
keybind = cmd+d=csi:100;9u
keybind = cmd+shift+d=ignore

keybind = command+digit_1=csi:49;9u
keybind = command+digit_2=csi:50;9u
keybind = command+digit_3=csi:51;9u
keybind = command+digit_4=csi:52;9u
keybind = command+digit_5=csi:53;9u
keybind = command+digit_6=csi:54;9u
keybind = command+digit_7=csi:55;9u
keybind = command+digit_8=csi:56;9u
keybind = command+digit_9=csi:57;9u
keybind = command+digit_0=csi:48;9u

config-file = ?config.local
