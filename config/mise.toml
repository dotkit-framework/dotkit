# dotkit base, linked to ~/.config/mise/conf.d/dotkit.toml. Your global tools
# are in config/mise.toml of the dotfiles repository (~/.config/mise/config.toml),
# which `dotkit add` and `mise use -g` edit. A tool there replaces the same tool
# here, for example node = "22".
[tools]
# Global default runtimes. Projects override them.
node = "24"
python = "3.14"
ruby = "3.4"

uv = { version = "latest", minimum_release_age = "1d" }

# config/herdr.toml and scripts/herdr configure it.
"github:herdrdev/herdr" = { version = "latest", minimum_release_age = "1d" }

[settings]
# New releases wait 7 days. A tool can set its own minimum_release_age.
minimum_release_age = "7d"
# Read the version files of other tools: .nvmrc, .node-version, .python-version,
# .ruby-version, and rust-toolchain.toml. Projects that use nvm, pyenv, rbenv,
# or rustup then need no extra mise config. Gemfile and package.json do not set
# versions. These settings are lists: a list in your config/mise.toml or in a
# project mise.toml replaces this one.
idiomatic_version_file_enable_tools = ["node", "python", "ruby", "rust"]
idiomatic_version_file_disable_files = ["ruby:Gemfile", "node:package.json"]
